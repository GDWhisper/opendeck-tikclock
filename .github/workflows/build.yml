name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: tikclock.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: tikclock
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: tikclock
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: tikclock
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bin: tikclock
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble plugin bundle
        run: |
          mkdir -p com.gdwhisper.tikclock.sdPlugin/bin
          cp artifacts/x86_64-pc-windows-msvc/tikclock.exe com.gdwhisper.tikclock.sdPlugin/bin/tikclock-x86_64-pc-windows-msvc.exe
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cp "artifacts/$target/tikclock" "com.gdwhisper.tikclock.sdPlugin/bin/tikclock-$target"
            chmod +x "com.gdwhisper.tikclock.sdPlugin/bin/tikclock-$target"
          done
          zip -r com.gdwhisper.tikclock.zip com.gdwhisper.tikclock.sdPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: com.gdwhisper.tikclock
          path: com.gdwhisper.tikclock.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: com.gdwhisper.tikclock.zip
