<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TikClock</title>
<style>
	:root { color-scheme: dark; }
	body {
		margin: 0;
		padding: 10px 12px;
		background: transparent;
		color: #d8d8d8;
		font-family: "Segoe UI", sans-serif;
		font-size: 13px;
	}
	.row {
		display: flex;
		align-items: center;
		margin-bottom: 10px;
		gap: 8px;
	}
	.row > label:first-child {
		flex: 0 0 90px;
		text-align: right;
		color: #9a9a9a;
	}
	select {
		flex: 1;
		background: #2d2d2d;
		color: #d8d8d8;
		border: 1px solid #3d3d3d;
		border-radius: 4px;
		padding: 4px 6px;
		font-size: 13px;
	}
	input[type="text"] {
		flex: 1;
		background: #2d2d2d;
		color: #d8d8d8;
		border: 1px solid #3d3d3d;
		border-radius: 4px;
		padding: 4px 6px;
		font-size: 13px;
	}
	input[type="color"] {
		width: 44px;
		height: 26px;
		padding: 0;
		border: 1px solid #3d3d3d;
		border-radius: 4px;
		background: #2d2d2d;
	}
	input[type="checkbox"] { accent-color: #4fc3f7; }
	.check-label { user-select: none; }
</style>
</head>
<body>
	<div class="row">
		<label for="position" data-i18n="position">Position</label>
		<select id="position">
			<option value="hour_pair" data-i18n="hour_pair">Hour — both digits</option>
			<option value="hour_tens" data-i18n="hour_tens">Hour — tens</option>
			<option value="hour_ones" data-i18n="hour_ones">Hour — ones</option>
			<option value="colon" data-i18n="colon">Colon :</option>
			<option value="minute_pair" data-i18n="minute_pair">Minute — both digits</option>
			<option value="minute_tens" data-i18n="minute_tens">Minute — tens</option>
			<option value="minute_ones" data-i18n="minute_ones">Minute — ones</option>
			<option value="second_pair" data-i18n="second_pair">Second — both digits</option>
			<option value="second_tens" data-i18n="second_tens">Second — tens</option>
			<option value="second_ones" data-i18n="second_ones">Second — ones</option>
		</select>
	</div>
	<div class="row">
		<label></label>
		<input type="checkbox" id="twenty_four_hour">
		<label class="check-label" for="twenty_four_hour" data-i18n="twenty_four_hour">24-hour clock</label>
	</div>
	<div class="row">
		<label></label>
		<input type="checkbox" id="blink_colon">
		<label class="check-label" for="blink_colon" data-i18n="blink_colon">Blinking colon</label>
	</div>
	<div class="row">
		<label for="color" data-i18n="color">Text color</label>
		<input type="color" id="color">
	</div>
	<div class="row">
		<label for="background" data-i18n="background">Background</label>
		<input type="color" id="background">
	</div>
	<div class="row">
		<label for="command" data-i18n="command">On-press command</label>
		<input type="text" id="command" data-i18n-placeholder="command_placeholder" placeholder="Empty = no action, e.g. notepad">
	</div>

<script>
	let websocket = null;
	let context = null;
	let settings = {
		position: "hour_tens",
		twenty_four_hour: true,
		blink_colon: true,
		color: "#ffffff",
		background: "#000000",
		command: ""
	};

	const fields = ["position", "twenty_four_hour", "blink_colon", "color", "background", "command"];

	// i18n：默认英文，宿主语言为 zh* 时切中文
	const I18N = {
		zh: {
			position: "显示位置",
			hour_pair: "时 — 两位同格",
			hour_tens: "时 — 十位",
			hour_ones: "时 — 个位",
			colon: "冒号 :",
			minute_pair: "分 — 两位同格",
			minute_tens: "分 — 十位",
			minute_ones: "分 — 个位",
			second_pair: "秒 — 两位同格",
			second_tens: "秒 — 十位",
			second_ones: "秒 — 个位",
			twenty_four_hour: "24 小时制",
			blink_colon: "冒号闪烁",
			color: "文字颜色",
			background: "背景颜色",
			command: "按键命令",
			command_placeholder: "留空则无动作，如 notepad"
		}
	};

	function applyI18n(language) {
		const dict = I18N[String(language || "").split(/[-_]/)[0]];
		if (!dict) return; // 英文为 HTML 默认文案
		document.querySelectorAll("[data-i18n]").forEach(el => {
			const text = dict[el.dataset.i18n];
			if (text) el.textContent = text;
		});
		document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
			const text = dict[el.dataset.i18nPlaceholder];
			if (text) el.placeholder = text;
		});
	}

	function applyToForm() {
		document.getElementById("position").value = settings.position;
		document.getElementById("twenty_four_hour").checked = settings.twenty_four_hour;
		document.getElementById("blink_colon").checked = settings.blink_colon;
		document.getElementById("color").value = settings.color;
		document.getElementById("background").value = settings.background;
		document.getElementById("command").value = settings.command;
	}

	function readFromForm() {
		settings.position = document.getElementById("position").value;
		settings.twenty_four_hour = document.getElementById("twenty_four_hour").checked;
		settings.blink_colon = document.getElementById("blink_colon").checked;
		settings.color = document.getElementById("color").value;
		settings.background = document.getElementById("background").value;
		settings.command = document.getElementById("command").value;
	}

	function saveSettings() {
		readFromForm();
		if (websocket && websocket.readyState === WebSocket.OPEN) {
			websocket.send(JSON.stringify({
				event: "setSettings",
				context: context,
				payload: settings
			}));
		}
	}

	fields.forEach(id => {
		document.getElementById(id).addEventListener("change", saveSettings);
	});

	// 宿主注入调用的入口
	function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
		context = uuid;
		applyI18n(JSON.parse(info)?.application?.language);
		const action = JSON.parse(actionInfo);
		settings = Object.assign(settings, action?.payload?.settings ?? {});
		applyToForm();

		websocket = new WebSocket("ws://localhost:" + port);
		websocket.onopen = () => {
			websocket.send(JSON.stringify({ event: registerEvent, uuid: uuid }));
		};
		websocket.onmessage = (message) => {
			const data = JSON.parse(message.data);
			if (data.event === "didReceiveSettings") {
				settings = Object.assign(settings, data.payload?.settings ?? {});
				applyToForm();
			}
		};
	}
	window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;

	applyToForm();
</script>
</body>
</html>
